<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mi Chef - Página no encontrada (Error 404). Regresa a disfrutar de nuestra cocina familiar." />
  <title>Página no Encontrada | Mi Chef Rotisería</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- CSS inline para mantener la estética idéntica sin romper las rutas relativas -->
  <style>
    /* VARIABLES COMPARTIDAS DE STYLE.CSS */
    :root {
      --terracota:    #C45C3A;
      --terracota-dk: #9E3E22;
      --bordo:        #6B1F1F;
      --bordo-dk:     #4A1212;
      --cream:        #FAF5EC;
      --cream-dk:     #F0E8D5;
      --gold:         #D4A843;
      --gold-light:   #EEC96A;
      --text-dark:    #1C1209;
      --text-mid:     #4A3728;
      --white:        #FFFFFF;
      --radius-md:    16px;
      --radius-lg:    28px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* DETALLES DE FONDO (TEXTURA SUTIL) */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(var(--cream-dk) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      opacity: 0.6;
      z-index: 1;
    }

    .error-container {
      position: relative;
      z-index: 2;
      max-width: 600px;
      background: var(--white);
      padding: 50px 40px;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 60px rgba(100, 40, 20, 0.08);
      border: 1px solid rgba(196, 92, 58, 0.1);
    }

    /* ÍCONO GOURMET */
    .error-icon {
      font-size: 4rem;
      color: var(--terracota);
      margin-bottom: 20px;
      animation: float 4s ease-in-out infinite;
    }

    .error-code {
      font-family: 'Playfair Display', serif;
      font-size: 6rem;
      font-weight: 700;
      color: var(--bordo);
      line-height: 1;
      margin-bottom: 10px;
      letter-spacing: -2px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--text-dark);
      margin-bottom: 15px;
    }

    p {
      color: var(--text-mid);
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    /* BOTÓN ESTILO MI CHEF */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--terracota), var(--bordo));
      color: var(--white);
      text-decoration: none;
      padding: 14px 32px;
      font-weight: 500;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 15px rgba(196, 92, 58, 0.3);
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(196, 92, 58, 0.4);
    }

    /* ANIMACIÓN */
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(5deg); }
    }

    @media (max-width: 480px) {
      .error-container {
        padding: 35px 20px;
      }
      .error-code {
        font-size: 4.5rem;
      }
      h1 {
        font-size: 1.7rem;
      }
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="error-icon">
      <i class="fa-solid fa-utensils"></i>
    </div>
    <div class="error-code">404</div>
    <h1>¡Ups! Plato no encontrado</h1>
    <p>Parece que la página que estás buscando se cocinó de más o nunca estuvo en nuestro menú. ¡No te preocupes, la cocina sigue abierta!</p>
    
    <a href="index.html" class="btn-back">
      <i class="fa-solid fa-house"></i> Volver al Inicio
    </a>
  </div>

</body>
</html>
